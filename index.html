  <style>
    :root {
      --bg: #e0e5da;
      --dark: #0a1a16;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: 'Inter', sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      background-color: var(--bg);
      overflow-x: hidden;
      padding: 20px;
      position: relative;
    }

    .blob-bg {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: -1;
      background: radial-gradient(circle at 20% 30%, var(--dark) 0%, var(--bg) 70%);
    }

    .glass-card {
      background: rgba(255, 255, 255, 0.2);
      backdrop-filter: blur(25px);
      -webkit-backdrop-filter: blur(25px);
      border: 1px solid rgba(255, 255, 255, 0.4);
      border-radius: 36px;
      padding: 44px 36px;
      width: 100%;
      max-width: 520px;
      box-shadow: 0 40px 90px rgba(0, 0, 0, 0.12);
      text-align: center;
    }

    .logo-container {
      width: 68px;
      height: 68px;
      background: var(--dark);
      border-radius: 18px;
      margin: 0 auto 16px auto;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 10px 20px rgba(10, 26, 22, 0.15);
    }

    .logo-container svg {
      width: 32px;
      height: 32px;
      fill: #ffffff;
    }

    .brand {
      font-weight: 900;
      font-size: 2.8rem;
      letter-spacing: -2px;
      color: var(--dark);
      margin: 0 0 6px 0;
    }

    .subtitle {
      opacity: 0.7;
      color: var(--dark);
      font-weight: 500;
      font-size: 0.95rem;
      margin-bottom: 28px;
    }

    .pin-container {
      display: flex;
      justify-content: center;
      gap: 8px;
      margin-bottom: 24px;
    }

    .pin-digit {
      width: 48px;
      height: 60px;
      background: rgba(255, 255, 255, 0.7);
      border: 1.5px solid rgba(10, 26, 22, 0.15);
      border-radius: 14px;
      color: var(--dark);
      font-size: 1.6rem;
      font-weight: 800;
      text-align: center;
      text-transform: uppercase;
      outline: none;
      transition: all 0.2s ease;
    }

    .pin-digit:focus {
      border-color: var(--dark);
      background: #ffffff;
      box-shadow: 0 0 0 3px rgba(10, 26, 22, 0.1);
    }

    .connect-btn {
      width: 100%;
      background: var(--dark);
      color: #ffffff;
      border: none;
      border-radius: 14px;
      padding: 14px 20px;
      font-weight: bold;
      font-size: 0.95rem;
      letter-spacing: 0.5px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      transition: opacity 0.2s ease;
    }

    .connect-btn:hover:not(:disabled) {
      opacity: 0.9;
    }

    .connect-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .status-msg {
      margin-top: 16px;
      font-size: 0.85rem;
      font-weight: 600;
      min-height: 20px;
    }

    .status-msg.error {
      color: #c62828;
    }

    .status-msg.success {
      color: #1b5e20;
    }

    /* Files View */
    .files-view {
      display: none;
      text-align: left;
    }

    .file-item {
      background: rgba(255, 255, 255, 0.65);
      border: 1px solid rgba(255, 255, 255, 0.8);
      border-radius: 20px;
      padding: 16px 20px;
      margin-top: 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      text-align: left;
      gap: 12px;
    }

    .file-name {
      color: var(--dark);
      font-weight: bold;
      font-size: 0.95rem;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      display: block;
    }

    .file-size {
      color: var(--dark);
      opacity: 0.6;
      font-size: 0.8rem;
      margin-top: 2px;
      display: block;
      font-weight: 600;
    }

    .dl-btn {
      background: var(--dark);
      color: #ffffff;
      border-radius: 12px;
      padding: 10px 20px;
      font-weight: bold;
      text-decoration: none;
      font-size: 0.85rem;
      white-space: nowrap;
      transition: opacity 0.2s;
    }

    .dl-btn:hover {
      opacity: 0.85;
    }

    .footer {
      position: fixed;
      bottom: 20px;
      width: 100%;
      text-align: center;
      font-size: 0.75rem;
      color: rgba(10, 26, 22, 0.45);
      letter-spacing: 1px;
      font-weight: 600;
    }

    .spinner {
      width: 18px;
      height: 18px;
      border: 2px solid rgba(255, 255, 255, 0.3);
      border-top-color: #ffffff;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      display: none;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div class="blob-bg"></div>

  <div class="glass-card" id="pinCard">
    <div class="logo-container">
      <svg viewBox="0 0 24 24">
        <path d="M19.35 10.04C18.67 6.59 15.64 4 12 4 9.11 4 6.6 5.64 5.35 8.04 2.34 8.36 0 10.91 0 14c0 3.31 2.69 6 6 6h13c2.76 0 5-2.24 5-5 0-2.64-2.05-4.78-4.65-4.96zM14 13v4h-4v-4H7l5-5 5 5h-3z"/>
      </svg>
    </div>
    <h1 class="brand">DROPIN</h1>
    <p class="subtitle">Your secure asset stream is ready</p>

    <div class="pin-container">
      <input type="text" maxlength="1" class="pin-digit" autofocus data-index="0" />
      <input type="text" maxlength="1" class="pin-digit" data-index="1" />
      <input type="text" maxlength="1" class="pin-digit" data-index="2" />
      <input type="text" maxlength="1" class="pin-digit" data-index="3" />
      <input type="text" maxlength="1" class="pin-digit" data-index="4" />
      <input type="text" maxlength="1" class="pin-digit" data-index="5" />
    </div>

    <button class="connect-btn" id="connectBtn" onclick="connectSession()">
      <span id="btnText">CONNECT & DOWNLOAD</span>
      <div class="spinner" id="btnSpinner"></div>
    </button>

    <div class="status-msg" id="statusMsg"></div>
  </div>

  <!-- Files Card -->
  <div class="glass-card files-view" id="filesCard">
    <div class="logo-container" style="width: 50px; height: 50px; margin-bottom: 12px;">
      <svg viewBox="0 0 24 24" style="width: 24px; height: 24px;">
        <path d="M19.35 10.04C18.67 6.59 15.64 4 12 4 9.11 4 6.6 5.64 5.35 8.04 2.34 8.36 0 10.91 0 14c0 3.31 2.69 6 6 6h13c2.76 0 5-2.24 5-5 0-2.64-2.05-4.78-4.65-4.96zM14 13v4h-4v-4H7l5-5 5 5h-3z"/>
      </svg>
    </div>
    <h1 class="brand" style="font-size: 2.2rem;">SHARED ASSETS</h1>
    <p class="subtitle" id="pinSub"></p>

    <div id="fileListContainer" style="max-height: 50vh; overflow-y: auto; margin-bottom: 16px;"></div>

    <button class="connect-btn" onclick="resetView()" style="background: rgba(10, 26, 22, 0.15); color: var(--dark); margin-top: 10px;">
      ENTER ANOTHER PIN
    </button>
  </div>

  <div class="footer">crafted by ashutosh jena</div>

  <script>
    const pinInputs = document.querySelectorAll('.pin-digit');
    const connectBtn = document.getElementById('connectBtn');
    const btnText = document.getElementById('btnText');
    const btnSpinner = document.getElementById('btnSpinner');
    const statusMsg = document.getElementById('statusMsg');
    const pinCard = document.getElementById('pinCard');
    const filesCard = document.getElementById('filesCard');
    const fileListContainer = document.getElementById('fileListContainer');
    const pinSub = document.getElementById('pinSub');

    pinInputs.forEach((input, index) => {
      input.addEventListener('input', (e) => {
        const val = e.target.value.toUpperCase().replace(/[^A-Z0-9]/g, '');
        e.target.value = val;
        if (val && index < pinInputs.length - 1) {
          setTimeout(() => pinInputs[index + 1].focus(), 10);
        }
      });

      input.addEventListener('keydown', (e) => {
        if (e.key === 'Backspace' && !e.target.value && index > 0) {
          pinInputs[index - 1].focus();
        } else if (e.key === 'Enter') {
          connectSession();
        }
      });

      input.addEventListener('paste', (e) => {
        e.preventDefault();
        const raw = (e.clipboardData || window.clipboardData).getData('text').trim();
        
        // If a full Dropin stream URL was pasted, connect directly
        if (raw.startsWith('http://') || raw.startsWith('https://')) {
          try {
            const urlObj = new URL(raw);
            const tokenParam = urlObj.searchParams.get('token');
            if (tokenParam && tokenParam.length === 6) {
              for (let i = 0; i < 6; i++) {
                pinInputs[i].value = tokenParam[i] || '';
              }
            }
            window.location.href = raw;
            return;
          } catch(err) {
            window.location.href = raw;
            return;
          }
        }

        const text = raw.toUpperCase().replace(/[^A-Z0-9]/g, '');
        if (text.length >= 6) {
          for (let i = 0; i < 6; i++) {
            pinInputs[i].value = text[i] || '';
          }
          pinInputs[5].focus();
        }
      });
    });

    function getEnteredPin() {
      let pin = '';
      pinInputs.forEach(i => pin += i.value.trim());
      return pin.toUpperCase().replace(/[^A-Z0-9]/g, '');
    }

    function setLoading(isLoading, text) {
      connectBtn.disabled = isLoading;
      btnText.style.display = isLoading ? 'none' : 'block';
      btnSpinner.style.display = isLoading ? 'block' : 'none';
      if (isLoading) {
        statusMsg.className = 'status-msg';
        statusMsg.textContent = text || 'Locating stream...';
      }
    }

    async function fetchRelayCandidates(cleanPin) {
      const validMessages = [];
      try {
        const res = await fetch(`/api/resolve?pin=${encodeURIComponent(cleanPin)}`, { cache: 'no-store' });
        if (res.ok) {
          const data = await res.json();
          if (data && data.url) {
            validMessages.push({ url: data.url, time: Date.now() / 1000 });
          }
        }
      } catch(e) {}
      return validMessages;
    }

    async function connectSession() {
      const pin = getEnteredPin();
      if (pin.length < 6) {
        statusMsg.className = 'status-msg error';
        statusMsg.textContent = 'Please enter all 6 digits of the PIN';
        return;
      }

      setLoading(true, 'Connecting to Dropin session...');

      const maxAttempts = 15;
      let targetUrl = '';
      
      const debugDiv = document.getElementById('debugLog') || document.createElement('div');
      debugDiv.id = 'debugLog';
      debugDiv.style.cssText = 'position:fixed; bottom:0; left:0; width:100%; background:rgba(0,0,0,0.8); color:lime; font-family:monospace; font-size:10px; padding:10px; z-index:9999; max-height:150px; overflow-y:auto; word-break:break-all; text-align:left;';
      document.body.appendChild(debugDiv);
      const log = (msg) => { debugDiv.innerHTML += `<div>[${new Date().toLocaleTimeString()}] ${msg}</div>`; debugDiv.scrollTop = debugDiv.scrollHeight; };
      
      log(`Starting connection for PIN: ${pin}`);

      for (let attempt = 1; attempt <= maxAttempts; attempt++) {
        try {
          if (attempt > 1) {
            statusMsg.textContent = `Finding stream (Attempt ${attempt}/${maxAttempts})...`;
          }

          log(`Attempt ${attempt}: Fetching candidates...`);
          const rawCandidates = await fetchRelayCandidates(pin);
          const candidates = [];
          
          for (const raw of rawCandidates) {
            if (raw.url.includes(',')) {
              raw.url.split(',').forEach(u => {
                if (u.trim().length > 0) candidates.push({ url: u.trim(), time: raw.time });
              });
            } else {
              candidates.push(raw);
            }
          }

          log(`Attempt ${attempt}: Found ${candidates.length} candidates: ${JSON.stringify(candidates)}`);

          // 1. Try direct reachability on candidate streams (Local Hotspot/Wi-Fi or Tunnel)
          for (const item of candidates) {
            if (item.url.startsWith("error:")) {
              log(`Diagnostic Error from Android: ${item.url}`);
              continue; // Skip error items
            }

            try {
              const base = item.url.split('?')[0];
              const controller = new AbortController();
              const timeoutId = setTimeout(() => controller.abort(), 10000);

              log(`Testing candidate: ${base}/api/files?token=${pin}`);
              const testRes = await fetch(`${base}/api/files?token=${encodeURIComponent(pin)}`, { 
                signal: controller.signal,
                headers: {
                  'Bypass-Tunnel-Reminder': 'true',
                  'ngrok-skip-browser-warning': '69420'
                }
              });
              clearTimeout(timeoutId);
              
              log(`Test result for ${base}: status=${testRes.status} ok=${testRes.ok}`);

              if (testRes.ok) {
                targetUrl = item.url;
                const files = await testRes.json();
                log(`Successfully parsed ${files.length} files from ${base}`);
                displayFiles(pin, targetUrl, files);
                setLoading(false);
                startPolling(pin, targetUrl);
                return;
              }
            } catch(e) {
                log(`Fetch failed for candidate: ${e.message}`);
            }
          }

          if (attempt < maxAttempts) {
            await new Promise(r => setTimeout(r, 2000));
          }
        } catch(e) {
            log(`Outer loop error: ${e.message}`);
        }
      }

      // If we reach here, no candidate was successfully reached
      setLoading(false);
      statusMsg.className = 'status-msg error';
      statusMsg.textContent = 'Stream disconnected or unreachable. Make sure the sender is actively sharing and has internet connection.';
      log(`Failed after 15 attempts.`);
    }

    let pollInterval = null;
    let currentPin = '';
    let currentTargetUrl = '';

    function startPolling(pin, initialUrl) {
      currentPin = pin;
      currentTargetUrl = initialUrl;
      if (pollInterval) clearInterval(pollInterval);
      
      pollInterval = setInterval(async () => {
        try {
          const rawCandidates = await fetchRelayCandidates(currentPin);
          const candidates = [];
          for (const raw of rawCandidates) {
            if (raw.url.includes(',')) {
              raw.url.split(',').forEach(u => {
                if (u.trim().length > 0) candidates.push({ url: u.trim(), time: raw.time });
              });
            } else {
              candidates.push(raw);
            }
          }

          if (candidates.length > 0) {
            // Find first valid candidate
            const newestUrl = candidates.find(c => !c.url.startsWith("error:"))?.url;
            if (newestUrl && newestUrl !== currentTargetUrl) {
              const base = newestUrl.split('?')[0];
              const controller = new AbortController();
              const timeoutId = setTimeout(() => controller.abort(), 10000);
              const testRes = await fetch(`${base}/api/files?token=${encodeURIComponent(currentPin)}`, {
                signal: controller.signal,
                headers: {
                  'Bypass-Tunnel-Reminder': 'true',
                  'ngrok-skip-browser-warning': '69420'
                }
              });
              clearTimeout(timeoutId);
              
              if (testRes.ok) {
                currentTargetUrl = newestUrl;
                const files = await testRes.json();
                displayFiles(currentPin, currentTargetUrl, files);
              }
            }
          }
        } catch(e) {}
      }, 5000);
    }

    function displayFiles(pin, targetUrl, files) {
      pinCard.style.display = 'none';
      filesCard.style.display = 'block';
      pinSub.textContent = `Active stream for PIN: ${pin}`;
      fileListContainer.innerHTML = '';

      if (!files || files.length === 0) {
        fileListContainer.innerHTML = '<p style="opacity:0.5; text-align:center; padding:20px;">No assets shared.</p>';
        return;
      }

      const base = targetUrl.split('?')[0];
      files.forEach(f => {
        const item = document.createElement('div');
        item.className = 'file-item';

        const info = document.createElement('div');
        const name = document.createElement('b');
        name.style.color = 'var(--dark)';
        name.textContent = f.name;

        const size = document.createElement('small');
        size.style.color = 'var(--dark)';
        size.style.opacity = '0.6';
        size.style.display = 'block';
        size.textContent = `${(f.size / 1048576).toFixed(2)} MB`;

        info.appendChild(name);
        info.appendChild(size);

        const btn = document.createElement('button');
        btn.className = 'dl-btn';
        btn.style.border = 'none';
        btn.style.cursor = 'pointer';
        btn.textContent = 'DOWNLOAD';
        
        btn.onclick = async () => {
          try {
            btn.textContent = 'DOWNLOADING...';
            btn.style.opacity = '0.5';
            btn.disabled = true;
            
            const url = `${base}/download?id=${encodeURIComponent(f.id)}&token=${encodeURIComponent(pin)}`;
            const response = await fetch(url, {
              headers: {
                'Bypass-Tunnel-Reminder': 'true',
                'ngrok-skip-browser-warning': '69420'
              }
            });
            
            if (!response.ok) throw new Error('Download failed');
            
            const blob = await response.blob();
            const blobUrl = URL.createObjectURL(blob);
            
            const a = document.createElement('a');
            a.href = blobUrl;
            a.download = f.name;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(blobUrl);
            
            btn.textContent = 'DOWNLOADED';
            btn.style.background = '#1b5e20';
          } catch(err) {
            console.error(err);
            btn.textContent = 'FAILED';
            btn.style.background = '#c62828';
          } finally {
            setTimeout(() => {
              btn.textContent = 'DOWNLOAD';
              btn.style.background = 'var(--dark)';
              btn.style.opacity = '1';
              btn.disabled = false;
            }, 3000);
          }
        };

        item.appendChild(info);
        item.appendChild(btn);
        fileListContainer.appendChild(item);
      });
    }

    function resetView() {
      if (pollInterval) clearInterval(pollInterval);
      pollInterval = null;
      currentPin = '';
      currentTargetUrl = '';
      
      filesCard.style.display = 'none';
      pinCard.style.display = 'block';
      pinInputs.forEach(i => i.value = '');
      statusMsg.textContent = '';
      pinInputs[0].focus();
    }
  </script>
</body>
</html>
