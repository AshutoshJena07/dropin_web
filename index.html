  <style>
    :root {
      --bg: #e0e5da;
      --dark: #0a1a16;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: 'Inter', sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      background-color: var(--bg);
      overflow-x: hidden;
      padding: 20px;
      position: relative;
    }

    .blob-bg {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: -1;
      background: radial-gradient(circle at 20% 30%, var(--dark) 0%, var(--bg) 70%);
    }

    .glass-card {
      background: rgba(255, 255, 255, 0.2);
      backdrop-filter: blur(25px);
      -webkit-backdrop-filter: blur(25px);
      border: 1px solid rgba(255, 255, 255, 0.4);
      border-radius: 36px;
      padding: 44px 36px;
      width: 100%;
      max-width: 520px;
      box-shadow: 0 40px 90px rgba(0, 0, 0, 0.12);
      text-align: center;
    }

    .logo-container {
      width: 68px;
      height: 68px;
      background: var(--dark);
      border-radius: 18px;
      margin: 0 auto 16px auto;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 10px 20px rgba(10, 26, 22, 0.15);
    }

    .logo-container svg {
      width: 32px;
      height: 32px;
      fill: #ffffff;
    }

    .brand {
      font-weight: 900;
      font-size: 2.8rem;
      letter-spacing: -2px;
      color: var(--dark);
      margin: 0 0 6px 0;
    }

    .subtitle {
      opacity: 0.7;
      color: var(--dark);
      font-weight: 500;
      font-size: 0.95rem;
      margin-bottom: 28px;
    }

    .pin-container {
      display: flex;
      justify-content: center;
      gap: 8px;
      margin-bottom: 24px;
    }

    .pin-digit {
      width: 48px;
      height: 60px;
      background: rgba(255, 255, 255, 0.7);
      border: 1.5px solid rgba(10, 26, 22, 0.15);
      border-radius: 14px;
      color: var(--dark);
      font-size: 1.6rem;
      font-weight: 800;
      text-align: center;
      text-transform: uppercase;
      outline: none;
      transition: all 0.2s ease;
    }

    .pin-digit:focus {
      border-color: var(--dark);
      background: #ffffff;
      box-shadow: 0 0 0 3px rgba(10, 26, 22, 0.1);
    }

    .connect-btn {
      width: 100%;
      background: var(--dark);
      color: #ffffff;
      border: none;
      border-radius: 14px;
      padding: 14px 20px;
      font-weight: bold;
      font-size: 0.95rem;
      letter-spacing: 0.5px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      transition: opacity 0.2s ease;
    }

    .connect-btn:hover:not(:disabled) {
      opacity: 0.9;
    }

    .connect-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .status-msg {
      margin-top: 16px;
      font-size: 0.85rem;
      font-weight: 600;
      min-height: 20px;
    }

    .status-msg.error {
      color: #c62828;
    }

    .status-msg.success {
      color: #1b5e20;
    }

    /* Files View */
    .files-view {
      display: none;
      text-align: left;
    }

    .file-item {
      background: rgba(255, 255, 255, 0.65);
      border: 1px solid rgba(255, 255, 255, 0.8);
      border-radius: 20px;
      padding: 16px 20px;
      margin-top: 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      text-align: left;
      gap: 12px;
    }

    .file-name {
      color: var(--dark);
      font-weight: bold;
      font-size: 0.95rem;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      display: block;
    }

    .file-size {
      color: var(--dark);
      opacity: 0.6;
      font-size: 0.8rem;
      margin-top: 2px;
      display: block;
      font-weight: 600;
    }

    .dl-btn {
      background: var(--dark);
      color: #ffffff;
      border-radius: 12px;
      padding: 10px 20px;
      font-weight: bold;
      text-decoration: none;
      font-size: 0.85rem;
      white-space: nowrap;
      transition: opacity 0.2s;
    }

    .dl-btn:hover {
      opacity: 0.85;
    }

    .footer {
      position: fixed;
      bottom: 20px;
      width: 100%;
      text-align: center;
      font-size: 0.75rem;
      color: rgba(10, 26, 22, 0.45);
      letter-spacing: 1px;
      font-weight: 600;
    }

    .spinner {
      width: 18px;
      height: 18px;
      border: 2px solid rgba(255, 255, 255, 0.3);
      border-top-color: #ffffff;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      display: none;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div class="blob-bg"></div>

  <div class="glass-card" id="pinCard">
    <div class="logo-container">
      <svg viewBox="0 0 24 24">
        <path d="M19.35 10.04C18.67 6.59 15.64 4 12 4 9.11 4 6.6 5.64 5.35 8.04 2.34 8.36 0 10.91 0 14c0 3.31 2.69 6 6 6h13c2.76 0 5-2.24 5-5 0-2.64-2.05-4.78-4.65-4.96zM14 13v4h-4v-4H7l5-5 5 5h-3z"/>
      </svg>
    </div>
    <h1 class="brand">DROPIN</h1>
    <p class="subtitle">Your secure asset stream is ready</p>

    <div class="pin-container">
      <input type="text" maxlength="1" class="pin-digit" autofocus data-index="0" />
      <input type="text" maxlength="1" class="pin-digit" data-index="1" />
      <input type="text" maxlength="1" class="pin-digit" data-index="2" />
      <input type="text" maxlength="1" class="pin-digit" data-index="3" />
      <input type="text" maxlength="1" class="pin-digit" data-index="4" />
      <input type="text" maxlength="1" class="pin-digit" data-index="5" />
    </div>

    <button class="connect-btn" id="connectBtn" onclick="connectSession()">
      <span id="btnText">CONNECT & DOWNLOAD</span>
      <div class="spinner" id="btnSpinner"></div>
    </button>

    <div class="status-msg" id="statusMsg"></div>
  </div>

  <!-- Files Card -->
  <div class="glass-card files-view" id="filesCard">
    <div class="logo-container" style="width: 50px; height: 50px; margin-bottom: 12px;">
      <svg viewBox="0 0 24 24" style="width: 24px; height: 24px;">
        <path d="M19.35 10.04C18.67 6.59 15.64 4 12 4 9.11 4 6.6 5.64 5.35 8.04 2.34 8.36 0 10.91 0 14c0 3.31 2.69 6 6 6h13c2.76 0 5-2.24 5-5 0-2.64-2.05-4.78-4.65-4.96zM14 13v4h-4v-4H7l5-5 5 5h-3z"/>
      </svg>
    </div>
    <h1 class="brand" style="font-size: 2.2rem;">SHARED ASSETS</h1>
    <p class="subtitle" id="pinSub"></p>

    <div id="fileListContainer" style="max-height: 50vh; overflow-y: auto; margin-bottom: 16px;"></div>

    <button class="connect-btn" onclick="resetView()" style="background: rgba(10, 26, 22, 0.15); color: var(--dark); margin-top: 10px;">
      ENTER ANOTHER PIN
    </button>
  </div>

  <div class="footer">crafted by ashutosh jena</div>

  <script>
    const pinInputs = document.querySelectorAll('.pin-digit');
    const connectBtn = document.getElementById('connectBtn');
    const btnText = document.getElementById('btnText');
    const btnSpinner = document.getElementById('btnSpinner');
    const statusMsg = document.getElementById('statusMsg');
    const pinCard = document.getElementById('pinCard');
    const filesCard = document.getElementById('filesCard');
    const fileListContainer = document.getElementById('fileListContainer');
    const pinSub = document.getElementById('pinSub');

    let currentPin = '';
    let isConnected = false;
    let peerConnection = null;
    let dataChannel = null;
    let fileBuffers = {};
    let signalingInterval = null;
    let pendingRemoteCandidates = [];
    let isRemoteDescriptionSet = false;

    function log(msg) {
      console.log('[Dropin WebRTC]', msg);
    }

    pinInputs.forEach((input, index) => {
      input.addEventListener('input', (e) => {
        const val = e.target.value.toUpperCase().replace(/[^A-Z0-9]/g, '');
        e.target.value = val;
        // Shift focus to next input
        if (val && index < pinInputs.length - 1) {
          pinInputs[index + 1].focus();
        }
        // Auto connect when the 6th digit is entered
        if (getEnteredPin().length === 6) {
          connectSession();
        }
      });

      input.addEventListener('keydown', (e) => {
        if (e.key === 'Backspace' && !e.target.value && index > 0) {
          pinInputs[index - 1].focus();
          pinInputs[index - 1].value = '';
        } else if (e.key === 'Enter') {
          connectSession();
        }
      });

      input.addEventListener('paste', (e) => {
        e.preventDefault();
        const raw = (e.clipboardData || window.clipboardData).getData('text').trim();
        
        if (raw.startsWith('http://') || raw.startsWith('https://')) {
          try {
            const urlObj = new URL(raw);
            const tokenParam = urlObj.searchParams.get('token') || urlObj.searchParams.get('pin');
            if (tokenParam && tokenParam.length === 6) {
              window.location.href = `/?pin=${tokenParam}`;
            }
            return;
          } catch(err) {
            return;
          }
        }

        const text = raw.toUpperCase().replace(/[^A-Z0-9]/g, '');
        if (text.length >= 6) {
          for (let i = 0; i < 6; i++) {
            pinInputs[i].value = text[i] || '';
          }
          connectSession();
        }
      });
    });

    window.onload = () => {
      const urlParams = new URLSearchParams(window.location.search);
      let token = urlParams.get('token') || urlParams.get('pin');
      if (token && token.length === 6) {
        token = token.toUpperCase().replace(/[^A-Z0-9]/g, '');
        for (let i = 0; i < 6; i++) {
          pinInputs[i].value = token[i] || '';
        }
        connectSession();
      }
    };

    function getEnteredPin() {
      let pin = '';
      pinInputs.forEach(i => pin += i.value.trim());
      return pin.toUpperCase().replace(/[^A-Z0-9]/g, '');
    }

    function setLoading(isLoading, text) {
      connectBtn.disabled = isLoading;
      btnText.style.display = isLoading ? 'none' : 'block';
      btnSpinner.style.display = isLoading ? 'block' : 'none';
      if (isLoading) {
        statusMsg.className = 'status-msg';
        statusMsg.textContent = text || 'Connecting...';
      }
    }

    async function postToVercel(query, body) {
      try {
        const res = await fetch(`/api/webrtc?pin=${currentPin}&${query}`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(body)
        });
        return await res.json();
      } catch (err) {
        log(`POST Error: ${err.message}`);
        return null;
      }
    }

    async function connectSession() {
      const pin = getEnteredPin();
      if (pin.length < 6) {
        statusMsg.className = 'status-msg error';
        statusMsg.textContent = 'Please enter all 6 digits of the PIN';
        return;
      }

      currentPin = pin;
      setLoading(true, 'Connecting to peer...');
      statusMsg.className = 'status-msg';
      log(`Starting WebRTC connection for PIN: ${pin}`);

      // Reset states
      isRemoteDescriptionSet = false;
      pendingRemoteCandidates = [];

      try {
        setupWebRTC();
        
        // 1. Create SDP Offer
        const offer = await peerConnection.createOffer();
        await peerConnection.setLocalDescription(offer);
        log('Created SDP Offer');
        
        await postToVercel('action=setOffer', { offer });
        log('Offer sent to Signaling Server');
        
        startSignalingPolling();
      } catch (err) {
        log(`Connection error: ${err.message}`);
        setLoading(false);
        statusMsg.className = 'status-msg error';
        statusMsg.textContent = 'Connection error: ' + err.message;
      }
    }

    function setupWebRTC() {
      const configuration = {
        iceServers: [
          { urls: 'stun:stun.l.google.com:19302' },
          { urls: 'stun:stun1.l.google.com:19302' },
          { urls: 'stun:stun2.l.google.com:19302' }
        ]
      };
      peerConnection = new RTCPeerConnection(configuration);

      // Create Data Channel
      dataChannel = peerConnection.createDataChannel('fileTransfer');
      setupDataChannel(dataChannel);

      peerConnection.onicecandidate = (event) => {
        if (event.candidate) {
          log('Discovered local ICE Candidate');
          postToVercel('action=addCandidate&role=web', { candidate: event.candidate });
        }
      };

      peerConnection.onconnectionstatechange = () => {
        log(`PeerConnection state: ${peerConnection.connectionState}`);
        if (peerConnection.connectionState === 'connected') {
          isConnected = true;
          setLoading(false);
          statusMsg.className = 'status-msg success';
          statusMsg.textContent = 'Connected Peer-to-Peer!';
        } else if (peerConnection.connectionState === 'disconnected' || peerConnection.connectionState === 'failed') {
          isConnected = false;
          statusMsg.className = 'status-msg error';
          statusMsg.textContent = 'Connection disconnected.';
        }
      };
    }

    function setupDataChannel(dc) {
      dc.binaryType = 'arraybuffer';
      
      dc.onopen = () => {
        log('DataChannel is open and ready');
        isConnected = true;
      };
      
      dc.onclose = () => {
        log('DataChannel is closed');
        isConnected = false;
      };
      
      dc.onmessage = (event) => {
        if (typeof event.data === 'string') {
          try {
            const msg = JSON.parse(event.data);
            if (msg.type === 'file_start') {
              log(`Incoming file: ${msg.name} (${msg.size} bytes)`);
              fileBuffers[msg.fileId] = {
                name: msg.name,
                size: msg.size,
                received: 0,
                chunks: []
              };
              updateDownloadProgress(msg.fileId, 0, msg.size);
            } else if (msg.type === 'file_end') {
              log(`File transfer complete: ${msg.fileId}`);
              saveFile(msg.fileId);
            }
          } catch (e) {
            log(`Text message error: ${e.message}`);
          }
        } else {
          // Binary chunk received
          const fileId = Object.keys(fileBuffers).find(id => fileBuffers[id].received < fileBuffers[id].size);
          if (fileId) {
            const buffer = fileBuffers[fileId];
            buffer.chunks.push(event.data);
            buffer.received += event.data.byteLength;
            updateDownloadProgress(fileId, buffer.received, buffer.size);
          }
        }
      };
    }
    
    function updateDownloadProgress(fileId, received, total) {
      const btn = document.getElementById(`btn-${fileId}`);
      if (btn) {
        const percent = Math.min(100, Math.round((received / total) * 100));
        btn.textContent = `DOWNLOADING ${percent}%`;
      }
    }

    function saveFile(fileId) {
      const buffer = fileBuffers[fileId];
      if (!buffer) return;
      
      const blob = new Blob(buffer.chunks);
      const url = URL.createObjectURL(blob);
      
      const a = document.createElement('a');
      a.href = url;
      a.download = buffer.name;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
      
      const btn = document.getElementById(`btn-${fileId}`);
      if (btn) {
        btn.textContent = 'DOWNLOADED';
        btn.style.background = '#1b5e20';
        btn.style.opacity = '1';
        btn.disabled = false;
      }
      
      delete fileBuffers[fileId];
    }

    function startSignalingPolling() {
      let answerReceived = false;
      let processedCandidates = 0;
      let metadataLoaded = false;

      if (signalingInterval) clearInterval(signalingInterval);

      signalingInterval = setInterval(async () => {
        try {
          const res = await fetch(`/api/webrtc?pin=${currentPin}`);
          const data = await res.json();
          
          // 1. Show Files metadata as soon as available
          if (data.metadata && !metadataLoaded) {
            metadataLoaded = true;
            displayFiles(currentPin, data.metadata);
          }

          // 2. Process Answer when available
          if (!answerReceived && data.answer) {
            answerReceived = true;
            log('Received SDP Answer from Android');
            await peerConnection.setRemoteDescription(new RTCSessionDescription(data.answer));
            isRemoteDescriptionSet = true;
            log('Remote Description set successfully on Web');

            // Drain queued ICE Candidates
            for (const cand of pendingRemoteCandidates) {
              log('Applying queued Android ICE Candidate');
              await peerConnection.addIceCandidate(new RTCIceCandidate(cand));
            }
            pendingRemoteCandidates = [];
          }

          // 3. Process Android ICE candidates
          if (data.candidates_android && data.candidates_android.length > processedCandidates) {
            for (let i = processedCandidates; i < data.candidates_android.length; i++) {
              const cand = data.candidates_android[i];
              if (isRemoteDescriptionSet) {
                log('Applying incoming Android ICE Candidate directly');
                await peerConnection.addIceCandidate(new RTCIceCandidate(cand));
              } else {
                log('Queueing Android ICE Candidate (Remote Description not set yet)');
                pendingRemoteCandidates.push(cand);
              }
            }
            processedCandidates = data.candidates_android.length;
          }
        } catch (err) {
          log(`Polling error: ${err.message}`);
        }
      }, 1500);
    }

    function displayFiles(pin, files) {
      pinCard.style.display = 'none';
      filesCard.style.display = 'block';
      pinSub.textContent = `Active secure stream for PIN: ${pin}`;
      fileListContainer.innerHTML = '';

      if (!files || files.length === 0) {
        fileListContainer.innerHTML = '<p style="opacity:0.5; text-align:center; padding:20px;">No assets shared.</p>';
        return;
      }

      files.forEach(f => {
        const item = document.createElement('div');
        item.className = 'file-item';

        const info = document.createElement('div');
        const name = document.createElement('b');
        name.style.color = 'var(--dark)';
        name.textContent = f.name;

        const size = document.createElement('small');
        size.style.color = 'var(--dark)';
        size.style.opacity = '0.6';
        size.style.display = 'block';
        size.textContent = `${(f.size / 1048576).toFixed(2)} MB`;

        info.appendChild(name);
        info.appendChild(size);

        const btn = document.createElement('button');
        btn.id = `btn-${f.id}`;
        btn.className = 'dl-btn';
        btn.style.border = 'none';
        btn.style.cursor = 'pointer';
        btn.textContent = 'DOWNLOAD';
        
        btn.onclick = () => {
          if (!dataChannel || dataChannel.readyState !== 'open') {
            btn.textContent = 'WAITING FOR PHONE...';
            btn.disabled = true;
            btn.style.opacity = '0.7';
            
            const checkAndSend = () => {
              if (dataChannel && dataChannel.readyState === 'open') {
                btn.textContent = 'STARTING...';
                btn.style.opacity = '0.5';
                dataChannel.send(JSON.stringify({ type: 'download', fileId: f.id }));
              } else {
                setTimeout(checkAndSend, 500);
              }
            };
            checkAndSend();
            return;
          }
          btn.textContent = 'STARTING...';
          btn.style.opacity = '0.5';
          btn.disabled = true;
          
          dataChannel.send(JSON.stringify({ type: 'download', fileId: f.id }));
        };

        item.appendChild(info);
        item.appendChild(btn);
        fileListContainer.appendChild(item);
      });
    }

    function resetView() {
      if (signalingInterval) clearInterval(signalingInterval);
      if (peerConnection) peerConnection.close();
      
      currentPin = '';
      isConnected = false;
      isRemoteDescriptionSet = false;
      pendingRemoteCandidates = [];
      
      filesCard.style.display = 'none';
      pinCard.style.display = 'block';
      pinInputs.forEach(i => i.value = '');
      statusMsg.textContent = '';
      pinInputs[0].focus();
    }
  </script>
</body>
</html>
