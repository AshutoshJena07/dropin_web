  <style>
    :root {
      --bg: #e0e5da;
      --dark: #0a1a16;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100dvh;
      font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background-color: var(--bg);
      overflow-x: hidden;
      padding: 16px;
      position: relative;
      box-sizing: border-box;
    }

    .blob-bg {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: -1;
      background: radial-gradient(circle at 20% 25%, rgba(10, 26, 22, 0.95) 0%, var(--bg) 75%);
    }

    .glass-card {
      background: rgba(255, 255, 255, 0.32);
      backdrop-filter: blur(28px);
      -webkit-backdrop-filter: blur(28px);
      border: 1px solid rgba(255, 255, 255, 0.55);
      border-radius: 32px;
      padding: 36px 28px;
      width: 100%;
      max-width: 480px;
      box-shadow: 0 30px 80px rgba(0, 0, 0, 0.1), 0 4px 16px rgba(0, 0, 0, 0.04);
      text-align: center;
      box-sizing: border-box;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    @media (max-width: 480px) {
      body {
        padding: 12px;
      }
      .glass-card {
        padding: 24px 18px;
        border-radius: 24px;
        box-shadow: 0 15px 40px rgba(0, 0, 0, 0.08);
      }
    }

    .logo-container {
      width: 58px;
      height: 58px;
      background: var(--dark);
      border-radius: 16px;
      margin: 0 auto 14px auto;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 10px 24px rgba(10, 26, 22, 0.2);
    }

    .logo-container svg {
      width: 28px;
      height: 28px;
      fill: #ffffff;
    }

    .brand {
      font-weight: 900;
      font-size: 2.2rem;
      letter-spacing: -1.5px;
      color: var(--dark);
      margin: 0 0 6px 0;
      line-height: 1.1;
    }

    @media (max-width: 480px) {
      .brand {
        font-size: 1.75rem;
        letter-spacing: -1px;
      }
    }

    .subtitle {
      opacity: 0.75;
      color: var(--dark);
      font-weight: 500;
      font-size: 0.88rem;
      line-height: 1.4;
      margin-bottom: 20px;
      word-break: break-word;
    }

    .pin-container {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: clamp(4px, 1.8vw, 8px);
      margin-bottom: 20px;
      width: 100%;
      max-width: 100%;
    }

    .pin-digit {
      flex: 1;
      max-width: 48px;
      min-width: 32px;
      height: clamp(48px, 14vw, 56px);
      background: rgba(255, 255, 255, 0.8);
      border: 1.5px solid rgba(10, 26, 22, 0.15);
      border-radius: 12px;
      color: var(--dark);
      font-size: clamp(1.2rem, 5vw, 1.5rem);
      font-weight: 800;
      text-align: center;
      text-transform: uppercase;
      outline: none;
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
      box-sizing: border-box;
      padding: 0;
    }

    .pin-digit:focus {
      border-color: var(--dark);
      background: #ffffff;
      box-shadow: 0 0 0 3px rgba(10, 26, 22, 0.12);
      transform: translateY(-2px);
    }

    .connect-btn {
      width: 100%;
      background: var(--dark);
      color: #ffffff;
      border: none;
      border-radius: 14px;
      padding: 13px 18px;
      font-weight: 700;
      font-size: 0.92rem;
      letter-spacing: 0.4px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      transition: all 0.2s ease;
      box-shadow: 0 6px 18px rgba(10, 26, 22, 0.15);
    }

    .connect-btn:hover:not(:disabled) {
      opacity: 0.92;
      transform: translateY(-1px);
    }

    .connect-btn:active:not(:disabled) {
      transform: translateY(1px);
    }

    .connect-btn:disabled {
      opacity: 0.55;
      cursor: not-allowed;
    }

    .status-msg {
      margin-top: 14px;
      font-size: 0.82rem;
      font-weight: 600;
      min-height: 18px;
      line-height: 1.3;
    }

    .status-msg.error {
      color: #b91c1c;
    }

    .status-msg.success {
      color: #15803d;
    }

    /* Files View */
    .files-view {
      display: none;
      text-align: left;
    }

    .connection-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 0.78rem;
      font-weight: 700;
      margin-bottom: 16px;
      background: rgba(10, 26, 22, 0.08);
      color: var(--dark);
      border: 1px solid rgba(255, 255, 255, 0.6);
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.03);
    }

    .connection-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #f59e0b;
      animation: pulse 1.5s infinite;
      flex-shrink: 0;
    }

    .connection-dot.connected {
      background: #10b981;
      animation: none;
    }

    .connection-dot.failed {
      background: #ef4444;
      animation: none;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(0.85); }
    }

    #fileListContainer {
      max-height: 46vh;
      overflow-y: auto;
      margin-bottom: 16px;
      padding-right: 2px;
      -webkit-overflow-scrolling: touch;
    }

    #fileListContainer::-webkit-scrollbar {
      width: 4px;
    }

    #fileListContainer::-webkit-scrollbar-thumb {
      background: rgba(10, 26, 22, 0.2);
      border-radius: 4px;
    }

    .file-item {
      background: rgba(255, 255, 255, 0.85);
      border: 1px solid rgba(255, 255, 255, 0.95);
      border-radius: 16px;
      padding: 12px 14px;
      margin-top: 10px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      text-align: left;
      box-shadow: 0 4px 12px rgba(10, 26, 22, 0.04);
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .file-item:hover {
      transform: translateY(-1px);
      box-shadow: 0 6px 16px rgba(10, 26, 22, 0.07);
    }

    .file-icon-box {
      width: 38px;
      height: 38px;
      border-radius: 11px;
      background: rgba(10, 26, 22, 0.08);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .file-icon-box svg {
      width: 20px;
      height: 20px;
      fill: var(--dark);
    }

    .file-info {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .file-name {
      color: var(--dark);
      font-weight: 700;
      font-size: 0.88rem;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      display: block;
      width: 100%;
      line-height: 1.25;
    }

    .file-size {
      color: var(--dark);
      opacity: 0.6;
      font-size: 0.74rem;
      margin-top: 2px;
      display: block;
      font-weight: 600;
    }

    .dl-btn {
      flex-shrink: 0;
      background: var(--dark);
      color: #ffffff;
      border: none;
      border-radius: 11px;
      padding: 9px 15px;
      font-weight: 700;
      font-size: 0.78rem;
      letter-spacing: 0.3px;
      white-space: nowrap;
      cursor: pointer;
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
      box-shadow: 0 4px 12px rgba(10, 26, 22, 0.12);
    }

    .dl-btn:hover:not(:disabled) {
      opacity: 0.9;
      transform: translateY(-1px);
    }

    .dl-btn:active:not(:disabled) {
      transform: translateY(1px);
    }

    .dl-btn:disabled {
      cursor: not-allowed;
    }

    @media (max-width: 380px) {
      .file-item {
        padding: 10px 12px;
        gap: 8px;
      }
      .file-icon-box {
        width: 34px;
        height: 34px;
      }
      .file-icon-box svg {
        width: 18px;
        height: 18px;
      }
      .file-name {
        font-size: 0.82rem;
      }
      .dl-btn {
        padding: 8px 12px;
        font-size: 0.74rem;
      }
    }

    .footer {
      width: 100%;
      text-align: center;
      font-size: 0.72rem;
      color: rgba(10, 26, 22, 0.45);
      letter-spacing: 1.2px;
      font-weight: 600;
      text-transform: uppercase;
      margin-top: 20px;
    }

    .spinner {
      width: 18px;
      height: 18px;
      border: 2px solid rgba(255, 255, 255, 0.3);
      border-top-color: #ffffff;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      display: none;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div class="blob-bg"></div>

  <!-- PIN Entry Card -->
  <div class="glass-card" id="pinCard">
    <div class="logo-container">
      <svg viewBox="0 0 24 24">
        <path d="M19.35 10.04C18.67 6.59 15.64 4 12 4 9.11 4 6.6 5.64 5.35 8.04 2.34 8.36 0 10.91 0 14c0 3.31 2.69 6 6 6h13c2.76 0 5-2.24 5-5 0-2.64-2.05-4.78-4.65-4.96zM14 13v4h-4v-4H7l5-5 5 5h-3z"/>
      </svg>
    </div>
    <h1 class="brand">DROPIN</h1>
    <p class="subtitle">Enter 6-digit PIN to access secure stream</p>

    <div class="pin-container">
      <input type="text" maxlength="1" class="pin-digit" autofocus data-index="0" inputmode="text" autocomplete="off" />
      <input type="text" maxlength="1" class="pin-digit" data-index="1" inputmode="text" autocomplete="off" />
      <input type="text" maxlength="1" class="pin-digit" data-index="2" inputmode="text" autocomplete="off" />
      <input type="text" maxlength="1" class="pin-digit" data-index="3" inputmode="text" autocomplete="off" />
      <input type="text" maxlength="1" class="pin-digit" data-index="4" inputmode="text" autocomplete="off" />
      <input type="text" maxlength="1" class="pin-digit" data-index="5" inputmode="text" autocomplete="off" />
    </div>

    <button class="connect-btn" id="connectBtn" onclick="connectSession()">
      <span id="btnText">CONNECT & DOWNLOAD</span>
      <div class="spinner" id="btnSpinner"></div>
    </button>

    <div class="status-msg" id="statusMsg"></div>
  </div>

  <!-- Files Card -->
  <div class="glass-card files-view" id="filesCard">
    <div class="logo-container" style="width: 48px; height: 48px; margin-bottom: 12px;">
      <svg viewBox="0 0 24 24" style="width: 24px; height: 24px;">
        <path d="M19.35 10.04C18.67 6.59 15.64 4 12 4 9.11 4 6.6 5.64 5.35 8.04 2.34 8.36 0 10.91 0 14c0 3.31 2.69 6 6 6h13c2.76 0 5-2.24 5-5 0-2.64-2.05-4.78-4.65-4.96zM14 13v4h-4v-4H7l5-5 5 5h-3z"/>
      </svg>
    </div>
    <h1 class="brand" style="font-size: 1.85rem;">SHARED ASSETS</h1>
    <p class="subtitle" id="pinSub" style="margin-bottom: 12px;"></p>

    <div style="text-align: center;">
      <div class="connection-badge" id="connBadge">
        <span class="connection-dot" id="connDot"></span>
        <span id="connText">Connecting to Phone...</span>
      </div>
    </div>

    <div id="fileListContainer"></div>

    <button class="connect-btn" onclick="resetView()" style="background: rgba(10, 26, 22, 0.12); color: var(--dark); margin-top: 12px; box-shadow: none;">
      ENTER ANOTHER PIN
    </button>
  </div>

  <div class="footer">crafted by ashutosh jena</div>

  <script>
    const pinInputs = document.querySelectorAll('.pin-digit');
    const connectBtn = document.getElementById('connectBtn');
    const btnText = document.getElementById('btnText');
    const btnSpinner = document.getElementById('btnSpinner');
    const statusMsg = document.getElementById('statusMsg');
    const pinCard = document.getElementById('pinCard');
    const filesCard = document.getElementById('filesCard');
    const fileListContainer = document.getElementById('fileListContainer');
    const pinSub = document.getElementById('pinSub');
    const connDot = document.getElementById('connDot');
    const connText = document.getElementById('connText');

    let currentPin = '';
    let isConnecting = false;
    let isConnected = false;
    let peerConnection = null;
    let dataChannel = null;
    let fileBuffers = {};
    let activeDownloadingFileId = null;
    let pendingDownloadFileId = null;
    let signalingInterval = null;
    let pendingRemoteCandidates = [];
    let isRemoteDescriptionSet = false;

    function log(msg) {
      console.log('[Dropin WebRTC]', msg);
    }

    function updateBadge(state, text) {
      if (!connDot || !connText) return;
      connDot.className = 'connection-dot ' + state;
      connText.textContent = text;
    }

    pinInputs.forEach((input, index) => {
      input.addEventListener('input', (e) => {
        const val = e.target.value.toUpperCase().replace(/[^A-Z0-9]/g, '');
        e.target.value = val;
        // Shift focus to next input
        if (val && index < pinInputs.length - 1) {
          pinInputs[index + 1].focus();
        }
        // Auto connect when the 6th digit is entered
        if (getEnteredPin().length === 6) {
          input.blur();
          connectSession();
        }
      });

      input.addEventListener('keydown', (e) => {
        if (e.key === 'Backspace' && !e.target.value && index > 0) {
          pinInputs[index - 1].focus();
          pinInputs[index - 1].value = '';
        } else if (e.key === 'Enter') {
          e.preventDefault();
          input.blur();
          connectSession();
        }
      });

      input.addEventListener('paste', (e) => {
        e.preventDefault();
        const raw = (e.clipboardData || window.clipboardData).getData('text').trim();
        
        if (raw.startsWith('http://') || raw.startsWith('https://')) {
          try {
            const urlObj = new URL(raw);
            const tokenParam = urlObj.searchParams.get('token') || urlObj.searchParams.get('pin');
            if (tokenParam && tokenParam.length === 6) {
              window.location.href = `/?pin=${tokenParam}`;
            }
            return;
          } catch(err) {
            return;
          }
        }

        const text = raw.toUpperCase().replace(/[^A-Z0-9]/g, '');
        if (text.length >= 6) {
          for (let i = 0; i < 6; i++) {
            pinInputs[i].value = text[i] || '';
          }
          connectSession();
        }
      });
    });

    function initFromUrl() {
      const urlParams = new URLSearchParams(window.location.search);
      let token = urlParams.get('token') || urlParams.get('pin');
      if (token && token.length === 6) {
        token = token.toUpperCase().replace(/[^A-Z0-9]/g, '');
        for (let i = 0; i < 6; i++) {
          if (pinInputs[i]) pinInputs[i].value = token[i] || '';
        }
        connectSession();
      }
    }

    if (document.readyState === 'loading') {
      window.addEventListener('DOMContentLoaded', initFromUrl);
    } else {
      initFromUrl();
    }

    function getEnteredPin() {
      let pin = '';
      pinInputs.forEach(i => pin += i.value.trim());
      return pin.toUpperCase().replace(/[^A-Z0-9]/g, '');
    }

    function setLoading(isLoading, text) {
      connectBtn.disabled = isLoading;
      btnText.style.display = isLoading ? 'none' : 'block';
      btnSpinner.style.display = isLoading ? 'block' : 'none';
      if (isLoading) {
        statusMsg.className = 'status-msg';
        statusMsg.textContent = text || 'Connecting...';
      }
    }

    function updateButtonStates() {
      const isReady = dataChannel && dataChannel.readyState === 'open';
      document.querySelectorAll('.dl-btn').forEach(btn => {
        const fileId = btn.id.replace('btn-', '');
        if (!btn.textContent.includes('DOWNLOADING') && !btn.textContent.includes('DOWNLOADED') && !btn.textContent.includes('STARTING')) {
          if (isReady) {
            btn.textContent = 'DOWNLOAD';
            btn.disabled = false;
            btn.style.opacity = '1';
          } else {
            if (pendingDownloadFileId === fileId) {
              btn.textContent = 'CONNECTING...';
              btn.disabled = false;
              btn.style.opacity = '0.8';
            } else {
              btn.textContent = isConnected ? 'DOWNLOAD' : 'WAITING FOR PHONE...';
              btn.disabled = false;
              btn.style.opacity = isConnected ? '1' : '0.7';
            }
          }
        }
      });
    }

    async function postToVercel(query, body) {
      try {
        const res = await fetch(`/api/webrtc?pin=${currentPin}&${query}`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(body)
        });
        return await res.json();
      } catch (err) {
        log(`POST Error: ${err.message}`);
        return null;
      }
    }

    async function connectSession() {
      const pin = getEnteredPin();
      if (pin.length < 6) {
        statusMsg.className = 'status-msg error';
        statusMsg.textContent = 'Please enter all 6 digits of the PIN';
        return;
      }

      if (isConnecting && currentPin === pin) {
        log('Connection already in progress for PIN: ' + pin);
        return;
      }

      isConnecting = true;
      currentPin = pin;
      setLoading(true, 'Connecting to peer...');
      statusMsg.className = 'status-msg';
      log(`Starting WebRTC connection for PIN: ${pin}`);

      // Reset states
      isRemoteDescriptionSet = false;
      pendingRemoteCandidates = [];
      isConnected = false;
      updateBadge('', 'Connecting to Phone...');

      try {
        setupWebRTC();
        
        // 1. Create SDP Offer
        const offer = await peerConnection.createOffer();
        const offerPayload = {
          type: offer.type,
          sdp: offer.sdp,
          id: Date.now().toString()
        };
        log('Created SDP Offer');
        
        // 2. Post Offer to Signaling Server FIRST
        await postToVercel('action=setOffer', { offer: offerPayload });
        log('Offer sent to Signaling Server');

        // 3. Set Local Description to trigger ICE candidate gathering cleanly
        await peerConnection.setLocalDescription(offer);
        log('Local SDP Offer set');
        
        startSignalingPolling();
      } catch (err) {
        isConnecting = false;
        log(`Connection error: ${err.message}`);
        setLoading(false);
        statusMsg.className = 'status-msg error';
        statusMsg.textContent = 'Connection error: ' + err.message;
        updateBadge('failed', 'Connection Failed');
      }
    }

    function setupWebRTC() {
      if (peerConnection) {
        try { peerConnection.close(); } catch(e) {}
      }

      const configuration = {
        iceServers: [
          { urls: 'stun:stun.l.google.com:19302' },
          { urls: 'stun:stun1.l.google.com:19302' },
          { urls: 'stun:stun2.l.google.com:19302' },
          { urls: 'stun:stun3.l.google.com:19302' },
          { urls: 'stun:stun4.l.google.com:19302' },
          { urls: 'stun:stun.cloudflare.com:3478' },
          {
            urls: 'turn:openrelay.metered.ca:80',
            username: 'openrelayproject',
            credential: 'openrelayproject'
          },
          {
            urls: 'turn:openrelay.metered.ca:443',
            username: 'openrelayproject',
            credential: 'openrelayproject'
          },
          {
            urls: 'turn:openrelay.metered.ca:443?transport=tcp',
            username: 'openrelayproject',
            credential: 'openrelayproject'
          }
        ],
        iceCandidatePoolSize: 10,
        bundlePolicy: 'max-bundle',
        rtcpMuxPolicy: 'require'
      };
      peerConnection = new RTCPeerConnection(configuration);

      // Create Data Channel
      dataChannel = peerConnection.createDataChannel('fileTransfer', {
        ordered: true
      });
      setupDataChannel(dataChannel);

      peerConnection.onicecandidate = (event) => {
        if (event.candidate && event.candidate.candidate) {
          log('Discovered local ICE Candidate');
          postToVercel('action=addCandidate&role=web', {
            candidate: {
              candidate: event.candidate.candidate,
              sdpMid: event.candidate.sdpMid || '0',
              sdpMLineIndex: event.candidate.sdpMLineIndex !== null ? event.candidate.sdpMLineIndex : 0
            }
          });
        }
      };

      peerConnection.onconnectionstatechange = () => {
        log(`PeerConnection state: ${peerConnection.connectionState}`);
        if (peerConnection.connectionState === 'connected') {
          isConnected = true;
          isConnecting = false;
          setLoading(false);
          statusMsg.className = 'status-msg success';
          statusMsg.textContent = 'Connected Peer-to-Peer!';
          updateBadge('connected', 'P2P Connected (Ready)');
          updateButtonStates();
        } else if (peerConnection.connectionState === 'disconnected' || peerConnection.connectionState === 'failed') {
          isConnected = false;
          isConnecting = false;
          statusMsg.className = 'status-msg error';
          statusMsg.textContent = 'Connection interrupted.';
          updateBadge('failed', 'Connection Failed');
          updateButtonStates();
        }
      };

      peerConnection.oniceconnectionstatechange = () => {
        log(`ICE Connection state: ${peerConnection.iceConnectionState}`);
        if (peerConnection.iceConnectionState === 'connected' || peerConnection.iceConnectionState === 'completed') {
          isConnected = true;
          isConnecting = false;
          setLoading(false);
          updateBadge('connected', 'P2P Connected (Ready)');
          updateButtonStates();
        } else if (peerConnection.iceConnectionState === 'failed') {
          isConnected = false;
          updateBadge('failed', 'Connection Failed');
          updateButtonStates();
        }
      };
    }

    function setupDataChannel(dc) {
      dc.binaryType = 'arraybuffer';
      
      dc.onopen = () => {
        log('DataChannel is open and ready');
        isConnected = true;
        isConnecting = false;
        setLoading(false);
        statusMsg.className = 'status-msg success';
        statusMsg.textContent = 'Connected Peer-to-Peer!';
        updateBadge('connected', 'P2P Connected (Ready)');
        updateButtonStates();

        // Trigger pending download if any
        if (pendingDownloadFileId) {
          const fid = pendingDownloadFileId;
          pendingDownloadFileId = null;
          startDownload(fid);
        }
      };
      
      dc.onclose = () => {
        log('DataChannel is closed');
        isConnected = false;
        isConnecting = false;
        updateBadge('failed', 'Disconnected');
        updateButtonStates();
      };

      dc.onerror = (err) => {
        log('DataChannel error: ' + (err.message || 'unknown error'));
      };
      
      dc.onmessage = (event) => {
        if (typeof event.data === 'string') {
          try {
            const msg = JSON.parse(event.data);
            if (msg.type === 'file_start') {
              log(`Incoming file: ${msg.name} (${msg.size} bytes)`);
              activeDownloadingFileId = msg.fileId;
              fileBuffers[msg.fileId] = {
                name: msg.name,
                size: msg.size,
                received: 0,
                chunks: []
              };
              updateDownloadProgress(msg.fileId, 0, msg.size);
            } else if (msg.type === 'file_end') {
              log(`File transfer complete: ${msg.fileId}`);
              saveFile(msg.fileId);
              activeDownloadingFileId = null;
            }
          } catch (e) {
            log(`Text message error: ${e.message}`);
          }
        } else {
          // Binary chunk received
          const fileId = activeDownloadingFileId || Object.keys(fileBuffers).find(id => fileBuffers[id].received < fileBuffers[id].size);
          if (fileId && fileBuffers[fileId]) {
            const buffer = fileBuffers[fileId];
            buffer.chunks.push(event.data);
            buffer.received += event.data.byteLength;
            updateDownloadProgress(fileId, buffer.received, buffer.size);
          }
        }
      };
    }
    
    function updateDownloadProgress(fileId, received, total) {
      const btn = document.getElementById(`btn-${fileId}`);
      if (btn) {
        const percent = total > 0 ? Math.min(100, Math.round((received / total) * 100)) : 100;
        btn.textContent = `DOWNLOADING ${percent}%`;
        btn.style.opacity = '0.7';
        btn.disabled = true;
      }
    }

    function saveFile(fileId) {
      const buffer = fileBuffers[fileId];
      if (!buffer) return;
      
      const blob = new Blob(buffer.chunks);
      const url = URL.createObjectURL(blob);
      
      const a = document.createElement('a');
      a.href = url;
      a.download = buffer.name;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      
      setTimeout(() => {
        URL.revokeObjectURL(url);
      }, 10000);
      
      const btn = document.getElementById(`btn-${fileId}`);
      if (btn) {
        btn.textContent = 'DOWNLOADED';
        btn.style.background = '#10b981';
        btn.style.opacity = '1';
        btn.disabled = false;
      }
      
      delete fileBuffers[fileId];
    }

    function startSignalingPolling() {
      let answerReceived = false;
      let processedCandidates = 0;
      let metadataLoaded = false;
      let pollCount = 0;

      if (signalingInterval) clearInterval(signalingInterval);

      signalingInterval = setInterval(async () => {
        pollCount++;
        try {
          // Always ensure download buttons reflect current dataChannel state
          updateButtonStates();

          const res = await fetch(`/api/webrtc?pin=${currentPin}`);
          const data = await res.json();
          
          // 1. Show Files metadata as soon as available
          if (data.metadata && !metadataLoaded) {
            metadataLoaded = true;
            displayFiles(currentPin, data.metadata);
          }

          if (!data.metadata && pollCount > 10 && !metadataLoaded) {
            statusMsg.className = 'status-msg';
            statusMsg.textContent = 'Searching for stream... Ensure Dropin is active on phone.';
          }

          // 2. Process Answer when available
          if (!answerReceived && data.answer) {
            log('Received SDP Answer from Android');
            try {
              const rtcAnswer = new RTCSessionDescription({
                type: data.answer.type || 'answer',
                sdp: data.answer.sdp || data.answer
              });
              await peerConnection.setRemoteDescription(rtcAnswer);
              answerReceived = true;
              isRemoteDescriptionSet = true;
              log('Remote Description set successfully on Web');

              // Drain queued ICE Candidates
              for (const cand of pendingRemoteCandidates) {
                log('Applying queued Android ICE Candidate');
                try {
                  await peerConnection.addIceCandidate(new RTCIceCandidate(cand));
                } catch (e) {
                  log('Queued candidate error: ' + e.message);
                }
              }
              pendingRemoteCandidates = [];
            } catch (sdpErr) {
              log('Error setting Remote Description: ' + sdpErr.message);
            }
          }

          // 3. Process Android ICE candidates
          if (data.candidates_android && data.candidates_android.length > processedCandidates) {
            for (let i = processedCandidates; i < data.candidates_android.length; i++) {
              let cand = data.candidates_android[i];
              if (typeof cand === 'string') {
                try { cand = JSON.parse(cand); } catch(e) {}
              }
              if (cand && cand.candidate) {
                const candInit = {
                  candidate: cand.candidate,
                  sdpMid: cand.sdpMid !== undefined ? cand.sdpMid : '0',
                  sdpMLineIndex: cand.sdpMLineIndex !== undefined ? cand.sdpMLineIndex : 0
                };
                if (isRemoteDescriptionSet) {
                  log('Applying incoming Android ICE Candidate directly');
                  try {
                    await peerConnection.addIceCandidate(new RTCIceCandidate(candInit));
                  } catch (e) {
                    log('Direct candidate error: ' + e.message);
                  }
                } else {
                  log('Queueing Android ICE Candidate (Remote Description not set yet)');
                  pendingRemoteCandidates.push(candInit);
                }
              }
            }
            processedCandidates = data.candidates_android.length;
          }
        } catch (err) {
          log(`Polling error: ${err.message}`);
        }
      }, 1000);
    }

    function startDownload(fileId) {
      if (dataChannel && dataChannel.readyState === 'open') {
        const btn = document.getElementById(`btn-${fileId}`);
        if (btn) {
          btn.textContent = 'STARTING...';
          btn.style.opacity = '0.7';
          btn.disabled = true;
        }
        dataChannel.send(JSON.stringify({ type: 'download', fileId: fileId }));
      } else {
        const btn = document.getElementById(`btn-${fileId}`);
        if (btn) {
          btn.textContent = 'CONNECTING...';
          btn.style.opacity = '0.8';
          btn.disabled = true;
        }
        pendingDownloadFileId = fileId;
      }
    }

    function getFileIcon(name) {
      const ext = (name.split('.').pop() || '').toLowerCase();
      if (['jpg', 'jpeg', 'png', 'gif', 'webp', 'svg', 'bmp', 'heic'].includes(ext)) {
        return `<svg viewBox="0 0 24 24"><path d="M21 19V5c0-1.1-.9-2-2-2H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2zM8.5 13.5l2.5 3.01L14.5 12l4.5 6H5l3.5-4.5z"/></svg>`;
      } else if (['mp4', 'mkv', 'mov', 'avi', 'webm', '3gp'].includes(ext)) {
        return `<svg viewBox="0 0 24 24"><path d="M17 10.5V7c0-.55-.45-1-1-1H4c-.55 0-1 .45-1 1v10c0 .55.45 1 1 1h12c.55 0 1-.45 1-1v-3.5l4 4v-11l-4 4z"/></svg>`;
      } else if (['mp3', 'wav', 'ogg', 'm4a', 'flac', 'aac'].includes(ext)) {
        return `<svg viewBox="0 0 24 24"><path d="M12 3v10.55c-.59-.34-1.27-.55-2-.55-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4V7h4V3h-6z"/></svg>`;
      } else if (['pdf'].includes(ext)) {
        return `<svg viewBox="0 0 24 24"><path d="M20 2H8c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zm-8.5 7.5c0 .83-.67 1.5-1.5 1.5H9v2H7.5V7H10c.83 0 1.5.67 1.5 1.5v1zm5 2c0 .83-.67 1.5-1.5 1.5h-2.5V7H15c.83 0 1.5.67 1.5 1.5v3zm4-3H19v1h1.5V11H19v2h-1.5V7h3v1.5zM9 9.5h1v-1H9v1zm4.5 2h1v-3h-1v3zM4 6H2v14c0 1.1.9 2 2 2h14v-2H4V6z"/></svg>`;
      } else if (['zip', 'rar', '7z', 'tar', 'gz'].includes(ext)) {
        return `<svg viewBox="0 0 24 24"><path d="M20 6h-8l-2-2H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V8c0-1.1-.9-2-2-2zm-6 10h-2v-2h2v2zm0-4h-2v-2h2v2zm0-4h-2V6h2v2z"/></svg>`;
      }
      return `<svg viewBox="0 0 24 24"><path d="M14 2H6c-1.1 0-1.99.9-1.99 2L4 20c0 1.1.89 2 1.99 2H18c1.1 0 2-.9 2-2V8l-6-6zm2 16H8v-2h8v2zm0-4H8v-2h8v2zm-3-5V3.5L18.5 9H13z"/></svg>`;
    }

    function displayFiles(pin, files) {
      pinCard.style.display = 'none';
      filesCard.style.display = 'block';
      pinSub.textContent = `Active secure stream for PIN: ${pin}`;
      fileListContainer.innerHTML = '';

      if (!files || files.length === 0) {
        fileListContainer.innerHTML = '<p style="opacity:0.5; text-align:center; padding:20px;">No assets shared.</p>';
        return;
      }

      const isReady = dataChannel && dataChannel.readyState === 'open';

      files.forEach(f => {
        const item = document.createElement('div');
        item.className = 'file-item';

        const iconBox = document.createElement('div');
        iconBox.className = 'file-icon-box';
        iconBox.innerHTML = getFileIcon(f.name);

        const info = document.createElement('div');
        info.className = 'file-info';

        const name = document.createElement('span');
        name.className = 'file-name';
        name.textContent = f.name;
        name.title = f.name;

        const size = document.createElement('small');
        size.className = 'file-size';
        const mb = f.size / (1024 * 1024);
        size.textContent = mb >= 0.01 ? `${mb.toFixed(2)} MB` : `${Math.round(f.size / 1024)} KB`;

        info.appendChild(name);
        info.appendChild(size);

        const btn = document.createElement('button');
        btn.id = `btn-${f.id}`;
        btn.className = 'dl-btn';
        btn.textContent = isReady ? 'DOWNLOAD' : (isConnected ? 'DOWNLOAD' : 'WAITING FOR PHONE...');
        btn.disabled = false;
        btn.style.opacity = isReady ? '1' : '0.85';
        
        btn.onclick = () => {
          startDownload(f.id);
        };

        item.appendChild(iconBox);
        item.appendChild(info);
        item.appendChild(btn);
        fileListContainer.appendChild(item);
      });

      updateButtonStates();
    }

    function resetView() {
      if (signalingInterval) clearInterval(signalingInterval);
      if (peerConnection) {
        try { peerConnection.close(); } catch(e) {}
      }
      
      currentPin = '';
      isConnecting = false;
      isConnected = false;
      isRemoteDescriptionSet = false;
      pendingRemoteCandidates = [];
      pendingDownloadFileId = null;
      activeDownloadingFileId = null;
      fileBuffers = {};
      
      filesCard.style.display = 'none';
      pinCard.style.display = 'block';
      pinInputs.forEach(i => i.value = '');
      statusMsg.textContent = '';
      setLoading(false);
      pinInputs[0].focus();
    }
  </script>
